name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Two jobs. The source gate checks the things that are true of the
# repository whatever the compiler does, and the test job runs the suite
# against a released twill. The second one is new: until twill 1.6 there
# was no compiler that could run this code, and the comment here used to
# say so.
jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every source file is twill
        run: |
          stray=$(find . -path ./.git -prune -o -type f \
            ! -name '*.tw' ! -name '*.md' ! -name '*.yml' ! -name 'LICENSE' \
            ! -name '.gitignore' ! -name '*.toml' -print)
          # A .toml here is the subject rather than a stray: spool.toml is
          # spool's own manifest, in the format this repository exists to read.
          # It was not in the list, and this gate had been red since the
          # manifest was committed.
          if [ -n "$stray" ]; then
            echo "spool is written in twill; these files are neither .tw nor documentation:"
            echo "$stray"
            exit 1
          fi

      - name: No reference to the old language name
        run: |
          # twill had an earlier name. It should not appear anywhere, including
          # in prose. The pattern is assembled from parts so that this step does
          # not match its own source, the same trick the em dash check uses.
          old="ra""ster"
          if grep -rni "$old" --include='*.tw' --include='*.md' --include='*.yml' .; then
            echo "found a reference to the old language name; it is twill"
            exit 1
          fi

      - name: No file carries the old source extension
        run: |
          # The string ".ra" is allowed in the source: spool rejects an entry
          # that uses the old extension and the error names it. A file actually
          # carrying it is not allowed.
          if find . -name '*.ra' | grep .; then
            echo "twill source is .tw"
            exit 1
          fi

      - name: No em dashes
        run: |
          # The character is built with printf rather than written literally,
          # so that this check does not fail on its own source.
          dash=$(printf '\xe2\x80\x94')
          if grep -rn "$dash" --include='*.tw' --include='*.md' --include='*.yml' .; then
            echo "em dashes are not used in this repository"
            exit 1
          fi

      - name: Every twill source declares its mode
        run: |
          for f in $(find . -name '*.tw'); do
            if [ "$(head -n 1 "$f")" != "mode systems" ]; then
              echo "$f does not start with 'mode systems'"
              exit 1
            fi
          done

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The twill binary comes from a release rather than being built here.
      # spool is written in twill and has no build of its own, so the only
      # thing CI needs is a compiler, and a released one is the version a user
      # would have. Pinned rather than floating: a green run should mean this
      # code passed against a known compiler, not against whatever was newest
      # that morning.
      - name: Install twill v1.7.0
        run: |
          curl -fsSL -o twill \
            https://github.com/twill-lang/twill/releases/download/v1.7.0/twill-v1.7.0-linux-amd64
          chmod +x twill
          ./twill --version

      - name: Check every source file
        run: |
          # src/vendor.tw is the exception, and it is a decision rather than a
          # bug: it calls `run`, a process interface twill does not have and
          # has deliberately not added, because it is a question about the
          # security surface of running a .tw file. Vendoring from git is the
          # one spool feature that waits on that answer.
          skip="src/vendor.tw"
          fail=0
          for f in $(find src tests examples -name '*.tw' 2>/dev/null); do
            case " $skip " in *" $f "*) continue ;; esac
            if ! ./twill check "$f"; then
              fail=1
            fi
          done
          exit $fail

      - name: Run the tests
        run: ./twill test tests
